plots:
- dft-qe_0_PhaseDiagram_results:
    x:
      nodes/dft-qe/0/PhaseDiagram/results.csv: data_id
    y:
      nodes/dft-qe/0/PhaseDiagram/results.csv: formation_energy
stages:
  dft-qe_0_PhaseDiagram:
    cmd: zntrack run mlipx.nodes.phase_diagram.PhaseDiagram --name dft-qe_0_PhaseDiagram
    deps:
    - nodes/initialize/LoadDataFile/node-meta.json
    metrics:
    - nodes/dft-qe/0/PhaseDiagram/node-meta.json:
        cache: false
    outs:
    - nodes/dft-qe/0/PhaseDiagram/frames.xyz
    - nodes/dft-qe/0/PhaseDiagram/phase_diagram.json
    - nodes/dft-qe/0/PhaseDiagram/results.csv
    params:
    - dft-qe_0_PhaseDiagram
  initialize_LoadDataFile:
    cmd: zntrack run mlipx.nodes.io.LoadDataFile --name initialize_LoadDataFile
    deps:
    - LiCoO_schmidt_2021_with_terminals_mad_recomputed.xyz
    metrics:
    - nodes/initialize/LoadDataFile/node-meta.json:
        cache: false
    params:
    - initialize_LoadDataFile
